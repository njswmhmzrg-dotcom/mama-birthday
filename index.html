<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для мамы ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-page">

    <!-- Анимированный фон -->
    <div class="aurora">
        <span class="aurora-blob a1"></span>
        <span class="aurora-blob a2"></span>
        <span class="aurora-blob a3"></span>
    </div>

    <!-- Парящие частицы -->
    <div class="petals" id="petals"></div>
    <div class="sparkles" id="sparkles"></div>

    <!-- Затемнение при переходе -->
    <div class="page-transition" id="pageTransition"></div>

    <!-- Музыка -->
    <audio id="music" loop preload="none">
        <source src="music/song.mp3" type="audio/mpeg">
    </audio>
    <button id="musicButton" class="music-button" aria-label="Музыка">🎵</button>

    <!-- Главный экран -->
    <section class="welcome">
        <div class="welcome-card">
            <p class="welcome-small">Для самого дорогого человека</p>

            <h1 class="welcome-title">
                <span>М</span><span>а</span><span>м</span><span>а</span>
                <span class="heart-beat">❤️</span>
            </h1>

            <p class="welcome-sub">У меня есть кое-что для вас...</p>

            <a href="gift.html" class="open-gift-btn" id="openGift">
                <span class="btn-text">Открыть подарок</span>
                <span class="btn-icon">💌</span>
                <span class="btn-shine"></span>
            </a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
